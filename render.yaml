# Render Blueprint — deployment source of truth (docs/sources-of-truth.md).
# Preview generation is automatic: every PR gets its own deploy preview, which
# is how "bots build, never merge" stays reviewable.
#
# Deployment source of truth (docs/sources-of-truth.md). PR previews generate
# automatically. Publishes the committed apps/connect files verbatim — no build
# step: rebuilding at deploy time would overwrite agent-authored changes with
# regenerated Phase 2 builder output. What was reviewed is what deploys.
previews:
  generation: automatic

services:
  - type: web
    name: connect
    runtime: static
    buildCommand: ""
    staticPublishPath: apps/connect
    autoDeployTrigger: commit
