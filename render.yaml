# Render Blueprint — deployment source of truth (docs/sources-of-truth.md).
# Preview generation is automatic: every PR gets its own deploy preview, which
# is how "bots build, never merge" stays reviewable.
#
# Connect this repo in the Render dashboard to activate PR previews.
# The POC page is generated deterministically from the design tokens at deploy
# time — the same builder the pipeline runs, so preview and PR always agree.
previews:
  generation: automatic

services:
  - type: web
    name: connect
    runtime: static
    buildCommand: node tools/poc-builder/index.mjs
    staticPublishPath: apps/connect
    autoDeployTrigger: commit
