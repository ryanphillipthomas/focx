# Render Blueprint — deployment source of truth (docs/sources-of-truth.md).
# Preview generation is automatic: every PR gets its own deploy preview, which
# is how "bots build, never merge" stays reviewable.
#
# NOTE: dormant until Phase 2 gives apps/connect a build. Connect this repo in
# the Render dashboard once the first pipeline run scaffolds the app.
previews:
  generation: automatic

services:
  - type: web
    name: connect
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @focx/connect build
    staticPublishPath: apps/connect/dist
    autoDeployTrigger: commit
