# The second loop. Render deploys on every push to staging and main; this
# workflow runs the deterministic release gate (tools/deploy-verify) after
# each one to prove what actually reached the internet: the expected commit
# serving, the public URL answering over valid TLS with this environment's
# content marker, custom domains verified, live Render configuration matching
# what the repo declares. On a healthy staging deploy it opens or updates a
# draft staging->main promotion PR; on a failed production deploy it rolls
# back to the last known-good deploy and opens an issue. Nothing here merges
# anything — docs/roles/deploy.md.
#
# The gate was an agent for one day (see that file's history): every failure
# it hit was agent-sandbox friction and every check it ran was mechanical, so
# the per-deploy path is code now. The role's charter remains the rulebook,
# and an agent is summoned only for audits or failure triage — never wired
# into this workflow. RENDER_API_KEY therefore never enters an LLM's
# environment at all.
#
# Per-repo values (service ids, public URLs, content markers, bot identity)
# come from pipeline/deploy.config.json, so this file stays parity-identical
# across focx and studio-810.
#
# paths-ignore prevents the loop this workflow would otherwise create: it
# commits the release record back to the deployed branch, and that push must
# not re-trigger verification of a content-identical rebuild.
name: deploy

on:
  push:
    branches: [staging, main]
    paths-ignore:
      - 'pipeline/releases/**'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read

# Never cancel a verification mid-flight — it might be mid-rollback. Queue.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  HAS_RENDER: ${{ secrets.RENDER_API_KEY != '' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      # PIPELINE_TOKEN so the promotion PR can trigger the drift gate — PRs
      # created with the default token trigger nothing. Falls back to the
      # default token; the PR still opens, gate-less.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PIPELINE_TOKEN || github.token }}

      - name: Key present?
        if: env.HAS_RENDER != 'true'
        run: |
          echo "::notice::deploy verification skipped — RENDER_API_KEY must be a repo secret. The deploy itself already happened on Render; it is merely unverified."

      - name: Resolve deploy context
        id: ctx
        if: env.HAS_RENDER == 'true'
        run: |
          set -euo pipefail
          BRANCH="$GITHUB_REF_NAME"
          EVENT=$(jq -r --arg b "$BRANCH" '.environments | to_entries[] | select(.value.branch == $b) | .key' pipeline/deploy.config.json)
          if [ -z "$EVENT" ]; then
            echo "::error::no environment in pipeline/deploy.config.json maps to branch $BRANCH"
            exit 1
          fi
          {
            echo "event=$EVENT"
            echo "service_id=$(jq -r --arg e "$EVENT" '.environments[$e].serviceId' pipeline/deploy.config.json)"
            echo "public_url=$(jq -r --arg e "$EVENT" '.environments[$e].publicUrl' pipeline/deploy.config.json)"
            echo "marker=$(jq -r --arg e "$EVENT" '.environments[$e].contentMarker' pipeline/deploy.config.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Verify the release
        id: verify
        if: steps.ctx.outputs.event != ''
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          GH_TOKEN: ${{ secrets.PIPELINE_TOKEN || github.token }}
          EVENT: ${{ steps.ctx.outputs.event }}
          EXPECTED_SHA: ${{ github.sha }}
          SERVICE_ID: ${{ steps.ctx.outputs.service_id }}
          PUBLIC_URL: ${{ steps.ctx.outputs.public_url }}
          CONTENT_MARKER: ${{ steps.ctx.outputs.marker }}
        run: node tools/deploy-verify/index.mjs

      # The gate writes; the workflow commits — an empty diff means no record
      # was produced, and an unrecorded deploy is a failure even when the
      # deploy itself was fine.
      - name: Commit release record
        if: steps.ctx.outputs.event != ''
        run: |
          set -euo pipefail
          git add pipeline/releases
          if git diff --cached --quiet; then
            echo "::error::deploy-verify produced no release record — the deploy is unrecorded."
            exit 1
          fi
          git config user.name "$(jq -r '.bot.name' pipeline/deploy.config.json)"
          git config user.email "$(jq -r '.bot.email' pipeline/deploy.config.json)"
          git commit -m "release: record for ${GITHUB_SHA:0:7} (${{ steps.ctx.outputs.event }}, ${{ steps.verify.outputs.outcome }})"
          git push origin "$GITHUB_REF_NAME"

      # The record is committed either way; the run's color reports the verdict.
      - name: Report outcome
        if: steps.ctx.outputs.event != ''
        run: |
          case "${{ steps.verify.outputs.outcome }}" in
            live)     echo "release verified live." ;;
            degraded) echo "::warning::release is serving but degraded — see ${{ steps.verify.outputs.record }}" ;;
            *)        echo "::error::release ${{ steps.verify.outputs.outcome }} — see ${{ steps.verify.outputs.record }}"; exit 1 ;;
          esac
