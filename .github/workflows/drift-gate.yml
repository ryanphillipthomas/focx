# The design-drift fail-safe. Runs on every PR; intended to be a required
# status check on main. The fix for a red gate is never to edit this file.
# See docs/drift-gate.md.
name: drift-gate

on:
  pull_request:

permissions:
  contents: read

# Rapid pushes to the same PR cancel the superseded gate run instead of
# stacking billed minutes.
concurrency:
  group: drift-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: drift-check
        uses: ryanphillipthomas/drift-check@v1
      - name: contract validation
        run: node tools/contracts/validate.mjs
      # `validate.mjs` checks that today's artifacts conform. This suite checks
      # that the validator itself still rejects what it is supposed to reject.
      - name: contract suite
        run: node --test tools/contracts/test.mjs
      - name: QA launcher safeguards
        run: node --test tools/qa-claude-agent-acp/*.test.mjs
      # The reporting script is a pilot's only way to write back to its task
      # under approve-reads. A regression here is silent: the run still
      # succeeds, and the report is simply lost.
      - name: agent reporting path
        run: node --test scripts/paperclip-issue-update.test.mjs
      # The gate's own detector. If this regresses, every other step in this
      # job is still green while the thing they depend on has stopped working.
      - name: drift-check suite
        run: node --test tools/drift-check/test.mjs
      - name: deploy verification suite
        run: node --test tools/deploy-verify/test.mjs
      - name: claude fallback suite
        run: node --test tools/claude-fallback/test.mjs
      - name: focx-bot Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: focx-bot contract schema
        run: node packages/focx-bot/src/index.mjs --validate-contract
      - name: focx-bot provisioning safeguards
        run: node --test packages/focx-bot/test.mjs
