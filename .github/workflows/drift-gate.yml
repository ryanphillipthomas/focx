# The design-drift fail-safe. Runs on every PR; intended to be a required
# status check on main. The fix for a red gate is never to edit this file.
# See docs/drift-gate.md.
name: drift-gate

on:
  pull_request:

permissions:
  contents: read

# Rapid pushes to the same PR cancel the superseded gate run instead of
# stacking billed minutes.
concurrency:
  group: drift-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: drift-check
        uses: ryanphillipthomas/drift-check@v1
      - name: contract validation
        run: node tools/contracts/validate.mjs
