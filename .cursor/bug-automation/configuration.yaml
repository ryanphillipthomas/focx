schema_version: 1
agent: slack-bug-triage-resolution
layout: .cursor/bug-automation  # chosen because no prior .cursor/benny tree; Benny two-job pack not adopted

automation:
  # NEW Automations entry — do not reuse the old Slack bug automation.
  id: "3762c69f-b631-11f1-bb68-864e54d14197"
  dashboard_url: "https://cursor.com/automations/3762c69f-b631-11f1-bb68-864e54d14197"
  observed_name: "Slack bug triage + resolution"
  observed_run_label: "Bug report resolution"
  # Cost-aware model preference for editor: cursor-grok-4.6-medium-fast (not Claude thinking)
  preferred_model: "cursor-grok-4.6-medium-fast"
  enabled_for_traffic: false  # keep disabled / do not enable until validation + old entry removed
  # OLD automation — must be disabled or deleted so it is not left active alongside this one:
  #   id: 59897871-b611-11f1-bb68-864e54d14197
  #   dashboard: https://cursor.com/automations/59897871-b611-11f1-bb68-864e54d14197
  #   observed name: Fix bugs reported in Slack / Bug report resolution
  superseded_automation_id: "59897871-b611-11f1-bb68-864e54d14197"
  superseded_automation_action: "disable_or_delete_before_enabling_replacement"

operations_path: ".cursor/automations/bug-agent/OPERATIONS.md"
notion_map_path: ".cursor/bug-automation/notion.md"
feature_map_path: ".cursor/bug-automation/feature-map.md"

slack:
  source_channel_id: "C0C3ASJ4RLL"
  source_channel_name: "bug-reports"
  team_id: "T0C3ASBK47N"
  workspace_host: "ryanthomasai.slack.com"
  operations_channel_id: ""  # none — never use an ops channel
  allow_source_root_posts: false
  allow_worker_slack_writes: false
  # Trigger field mapping (use actual payload fields; do not invent template vars):
  #   source_channel_id <- trigger.channel / slackChannelId
  #   message_ts        <- trigger.message_ts / slackMessageTimestamp
  #   thread_ts         <- trigger.thread_ts if present, else message_ts
  read_action: "read_slack_messages"
  thread_post_action: "send_slack_message"
  include_pr_urls_in_slack_text: false  # system supplies PR links

repository:
  url: "https://github.com/ryanphillipthomas/focx-site"
  default_branch: "main"
  draft_only: true
  # write_scope: draft PRs only in focx-site + focx-connect.
  # Merge / auto-merge / deploy remain OUT OF SCOPE (never_merge) pending explicit override.
  write_scope:
    mode: "draft_prs_only"
    allow_merge: false
    allow_auto_merge: false
    allow_deploy: false
    repos:
      - url: "https://github.com/ryanphillipthomas/focx-site"
        role: "primary"
        draft_prs: true
      - url: "https://github.com/ryanphillipthomas/focx-connect"
        role: "related_product"
        mount_path: "skills/connect"
        draft_prs: true
  related_product_repos:
    - url: "https://github.com/ryanphillipthomas/focx-connect"
      mount_path: "skills/connect"
      write_scope: "draft_prs_only"

notion:
  product_docs:
    status: "configured"
    database_url: "https://app.notion.com/p/3e17559fe2d780ed95d0e6f446f505d5"
    data_source: "collection://3e17559f-e2d7-80af-833c-000bcc071e00"
    notes: "Workspace Docs DB (PRD/RFC/Spec/…) — confirmed as product-doc read scope."
  bug_database:
    status: "configured"
    database_url: "https://app.notion.com/p/d90b04c202fd413a886fc6026bbb4aae"
    data_source: "collection://24dc9aeb-1c47-43c1-9f95-8309f900da1f"
    notes: "Dedicated Bugs DB (not Tasks). Field/status map in notion.md."

environment:
  status: "configured"
  name: "local-site-compose-dist"
  compose_command: "node tools/site-compose/index.mjs"
  compose_output: "dist/"
  serve: "local static server on dist/ (not production focx.ai)"
  allow_production_data_writes: false
  never_use_production_host: "focx.ai"
  artifact_directory: "/tmp/bug-agent-artifacts"

control:
  status: "configured"
  adapter: "playwright_mcp"
  feature_map_path: ".cursor/bug-automation/feature-map.md"

tools_expected:
  - read_slack_messages
  - send_slack_message
  - open_git_pr
  - notion_read_within_configured_scope
  - notion_write_bug_record_when_configured
  - playwright_mcp

boundaries:
  never_merge: true
  never_auto_merge: true
  never_deploy: true
  never_modify_production_data: true
  # Merge is OUT OF SCOPE pending explicit override.
